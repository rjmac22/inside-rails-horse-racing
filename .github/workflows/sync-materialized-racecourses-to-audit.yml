name: Sync materialized racecourses to audit

on:
  pull_request:
    branches:
      - audit/retrospective-implementation-closeout
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sync-materialized-racecourses-to-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Copy verified racecourse library only
        run: |
          git fetch origin study/gb-04-race-meetings-fixtures
          git checkout origin/study/gb-04-race-meetings-fixtures -- studies/jurisdictions/great_britain/racecourses
          rm -f .github/workflows/sync-materialized-racecourses-to-audit.yml

      - name: Validate copied library
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('studies/jurisdictions/great_britain/racecourses')
          notebooks = sorted(root.glob('*.ipynb'))
          assert len(notebooks) == 60, len(notebooks)
          generated = [p for p in notebooks if p.name not in {'aintree.ipynb', 'ascot.ipynb'}]
          assert len(generated) == 58
          forbidden = ('_racecourse_notebook_support', '_racecourse_research_payload', 'base64', 'gzip', 'exec(')
          for path in generated:
              text = path.read_text()
              data = json.loads(text)
              assert data['nbformat'] == 4
              assert len(data['cells']) >= 25, (path, len(data['cells']))
              for token in forbidden:
                  assert token not in text, (path, token)
          assert not (root / '_racecourse_notebook_support.py').exists()
          assert not (root / '_racecourse_research_payload.b64').exists()
          print('Audit racecourse library matches verified materialized structure.')
          PY

      - name: Commit sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync materialized GB racecourse notebooks to audit'
          git push origin HEAD:${{ github.head_ref }}
